services:
  backend:
    build:
      context: ./backend
      dockerfile: src/Subly.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Data Source=/app/data/subly.db
    volumes:
      - subly-data:/app/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "4173:80"

volumes:
  subly-data:
