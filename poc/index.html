<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subly — Subscription Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    /* Palette */
    --bg: #F6F7FB;
    --surface: #FFFFFF;
    --surface-2: #FAFAFC;
    --border: #ECEDF2;
    --border-strong: #DCDEE6;
    --text: #0B0D17;
    --text-2: #4B5266;
    --text-3: #8A91A3;
    --text-4: #B6BBCB;

    --brand-50: #EEF0FF;
    --brand-100: #DCE0FF;
    --brand-200: #B6BEFF;
    --brand-500: #5B6CFF;
    --brand-600: #4753F0;
    --brand-700: #3540C8;
    --brand-900: #1A2380;
    --brand-ink: #0E1453;

    --good: #16A34A;
    --good-bg: #E7F8EE;
    --warn: #B45309;
    --warn-bg: #FEF3C7;
    --bad: #DC2626;
    --bad-bg: #FEE4E2;

    /* Category palette */
    --c-streaming: #6366F1;
    --c-software:  #0EA5E9;
    --c-insurance: #14B8A6;
    --c-telecom:   #F97316;
    --c-energy:    #EAB308;
    --c-fitness:   #EC4899;
    --c-news:      #8B5CF6;
    --c-cloud:     #06B6D4;
    --c-member:    #84CC16;

    --r-xs: 6px;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-xl: 22px;

    --shadow-xs: 0 1px 2px rgba(11,13,23,.04);
    --shadow-sm: 0 1px 2px rgba(11,13,23,.05), 0 1px 1px rgba(11,13,23,.03);
    --shadow-md: 0 6px 20px -8px rgba(11,13,23,.12), 0 2px 6px rgba(11,13,23,.05);
    --shadow-lg: 0 24px 60px -20px rgba(11,13,23,.22), 0 8px 20px -10px rgba(11,13,23,.10);

    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
    --font-display: "Instrument Serif", "Geist", serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #DCDEE6; border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #B6BBCB; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Layout */
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .app[data-sidebar="collapsed"] { grid-template-columns: 72px 1fr; }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .sidebar-top { padding: 18px 18px 12px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(155deg, var(--brand-500), var(--brand-700));
    display: grid; place-items: center; color: white;
    box-shadow: 0 6px 14px -6px rgba(91,108,255,.6), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .brand-tag { font-size: 10px; color: var(--text-3); letter-spacing: .12em; text-transform: uppercase; margin-top: -2px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--text-3); }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  .nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: auto; }
  .nav-section-label { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; padding: 14px 12px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: 9px; color: var(--text-2); font-weight: 500;
    position: relative; user-select: none;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item[aria-current="page"] { background: var(--brand-50); color: var(--brand-700); font-weight: 600; }
  .nav-item[aria-current="page"] .nav-icon { color: var(--brand-600); }
  .nav-icon { width: 18px; height: 18px; color: var(--text-3); flex-shrink: 0; }
  .nav-badge { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .nav-item[aria-current="page"] .nav-badge { background: #fff; color: var(--brand-700); }

  .sidebar-footer { padding: 10px; border-top: 1px solid var(--border); }
  .user-card {
    display: flex; align-items: center; gap: 10px; padding: 8px;
    border-radius: 10px; cursor: pointer;
  }
  .user-card:hover { background: var(--surface-2); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(140deg, #fbbf24, #f43f5e);
    color: white; font-weight: 700; font-size: 12px;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .user-name { font-weight: 600; font-size: 13px; }
  .user-plan { font-size: 11px; color: var(--text-3); }

  /* Main */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    padding: 16px 28px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(246,247,251,.85);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.015em; }
  .topbar-spacer { flex: 1; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 14px; border-radius: 10px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); font-weight: 500;
    transition: all .12s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--brand-600); color: white; border-color: transparent; box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 6px 16px -6px rgba(71,83,240,.5); }
  .btn-primary:hover { background: var(--brand-700); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
  .btn-icon { width: 36px; padding: 0; justify-content: center; }
  .btn-danger { color: var(--bad); border-color: var(--border-strong); }
  .btn-danger:hover { background: var(--bad-bg); }

  /* Inputs */
  .input, .select {
    height: 36px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: var(--surface);
    outline: none; transition: all .12s ease; min-width: 0;
  }
  .input:focus, .select:focus { border-color: var(--brand-500); box-shadow: 0 0 0 3px rgba(91,108,255,.15); }
  .input-with-icon { position: relative; }
  .input-with-icon .input { padding-left: 36px; }
  .input-with-icon svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); box-shadow: var(--shadow-xs);
  }
  .card-pad { padding: 18px 20px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
  .card-title { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; display: flex; align-items: center; gap: 8px; }
  .card-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .content { padding: 24px 28px 60px; max-width: 1480px; margin: 0 auto; width: 100%; }

  /* KPI tiles */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 18px 18px 16px;
    position: relative; overflow: hidden;
  }
  .kpi-label { font-size: 12px; color: var(--text-3); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .kpi-value { font-size: 28px; font-weight: 700; letter-spacing: -0.022em; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .kpi-value .cents { font-size: 18px; color: var(--text-3); font-weight: 600; }
  .kpi-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text-3); }
  .delta { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px 1px 5px; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta-up { color: var(--good); background: var(--good-bg); }
  .delta-down { color: var(--bad); background: var(--bad-bg); }
  .delta-flat { color: var(--text-2); background: var(--surface-2); }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: var(--surface-2); color: var(--text-2);
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .badge-good { background: var(--good-bg); color: var(--good); }
  .badge-warn { background: var(--warn-bg); color: var(--warn); }
  .badge-bad { background: var(--bad-bg); color: var(--bad); }
  .badge-brand { background: var(--brand-50); color: var(--brand-700); }

  /* Subscription logo */
  .sub-logo {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; color: white; font-weight: 700;
    font-size: 14px; flex-shrink: 0;
    letter-spacing: -0.02em;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .sub-logo-sm { width: 28px; height: 28px; border-radius: 8px; font-size: 12px; }
  .sub-logo-lg { width: 56px; height: 56px; border-radius: 14px; font-size: 22px; }

  /* Tables */
  .tbl { width: 100%; border-collapse: separate; border-spacing: 0; }
  .tbl th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .tbl th:first-child { border-top-left-radius: var(--r-md); }
  .tbl th:last-child { border-top-right-radius: var(--r-md); }
  .tbl td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tr:hover td { background: var(--surface-2); }
  .tbl-numeric { text-align: right; font-variant-numeric: tabular-nums; }

  /* Utility */
  .row { display: flex; align-items: center; gap: 10px; }
  .col { display: flex; flex-direction: column; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .muted { color: var(--text-3); }
  .num { font-variant-numeric: tabular-nums; }
  .h-divider { height: 1px; background: var(--border); margin: 0; border: 0; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Tooltip-ish */
  .pill-tabs { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: 10px; gap: 2px; border: 1px solid var(--border); }
  .pill-tabs button { padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 500; color: var(--text-2); }
  .pill-tabs button:hover { color: var(--text); }
  .pill-tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-xs); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(11,13,23,.42);
    backdrop-filter: blur(6px); z-index: 100;
    display: grid; place-items: center; padding: 24px;
    animation: fadein .15s ease;
  }
  .modal {
    background: var(--surface); border-radius: 18px;
    box-shadow: var(--shadow-lg);
    width: 100%; max-width: 540px;
    max-height: calc(100vh - 48px);
    overflow: hidden; display: flex; flex-direction: column;
    animation: pop .2s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal-head { padding: 20px 24px 12px; display: flex; align-items: center; justify-content: space-between; }
  .modal-body { padding: 4px 24px 8px; overflow: auto; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: space-between; align-items: center; background: var(--surface-2); }

  /* Detail panel */
  .panel-backdrop {
    position: fixed; inset: 0; background: rgba(11,13,23,.32);
    z-index: 80; animation: fadein .15s ease;
  }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 480px;
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg); z-index: 90;
    display: flex; flex-direction: column;
    animation: slidein .22s cubic-bezier(.2,.9,.3,1);
  }

  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes slidein { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Mini-bar */
  .progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress > span { display: block; height: 100%; background: var(--brand-500); border-radius: 999px; }

  /* Calendar */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-h { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; text-align: center; padding: 8px 0 4px; }
  .cal-cell {
    background: var(--surface-2); border-radius: 10px; padding: 8px;
    min-height: 92px; display: flex; flex-direction: column; gap: 4px;
    border: 1px solid transparent;
    position: relative;
  }
  .cal-cell.today { border-color: var(--brand-500); background: var(--brand-50); }
  .cal-cell.muted { opacity: .35; }
  .cal-date { font-size: 12px; font-weight: 600; color: var(--text-2); }
  .cal-cell.today .cal-date { color: var(--brand-700); }
  .cal-event {
    display: flex; align-items: center; gap: 5px; padding: 2px 6px;
    background: var(--surface); border-radius: 6px;
    font-size: 11px; font-weight: 500; box-shadow: var(--shadow-xs);
    border-left: 3px solid currentColor;
  }
  .cal-event .num { color: var(--text); font-weight: 600; }
  .cal-more { font-size: 11px; color: var(--text-3); padding-left: 6px; }

  /* Chart helpers */
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 20px 4px; font-size: 12px; }
  .chart-legend > div { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
  .chart-legend .dot { width: 10px; height: 10px; border-radius: 3px; }

  /* Recommendations */
  .reco {
    display: flex; gap: 12px; padding: 14px 16px;
    border-radius: var(--r-md); border: 1px solid var(--border);
    background: var(--surface);
  }
  .reco-ic {
    width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0;
  }
  .reco-warn .reco-ic { background: var(--warn-bg); color: var(--warn); }
  .reco-bad .reco-ic { background: var(--bad-bg); color: var(--bad); }
  .reco-good .reco-ic { background: var(--good-bg); color: var(--good); }
  .reco-info .reco-ic { background: var(--brand-50); color: var(--brand-700); }
  .reco h4 { margin: 0; font-size: 13px; font-weight: 600; }
  .reco p { margin: 2px 0 8px; font-size: 12px; color: var(--text-2); }

  /* Tags */
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-2);
    font-size: 11px; font-weight: 500;
    border: 1px solid var(--border);
  }
  .tag-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Filters bar */
  .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; }
  .seg button { padding: 7px 12px; font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--surface); border-right: 1px solid var(--border-strong); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--brand-50); color: var(--brand-700); }

  /* Misc */
  .clickable { cursor: pointer; }
  .focus-ring:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.js"></script>
<script type="text/babel" src="icons.jsx"></script>

<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="subscriptions.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
